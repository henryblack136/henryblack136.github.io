{% extends "encyclopedia/layout.html" %}

{% block title %}
    Search
{% endblock %}

{% block body %}
    <h1> Search results:</h1>

    <ul>
        {% for entry in entries %}
            {% if query in entry %}
                <li><a  href="{{ entry }}">{{ entry }}</a></li>
            {% endif %}
        {% endfor %}
    </ul>
{% endblock %}
